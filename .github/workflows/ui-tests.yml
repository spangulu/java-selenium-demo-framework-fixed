name: UI Tests
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn clean test -Pci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-results
          path: |
            target/reports
            target/screenshots
            target/logs
            target/surefire-reports
